<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Refractive Surface — DiyarDesk</title>
  <script src="low-mode.js"></script>
  <script src="wall-icons.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #091d38; touch-action: none; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: auto; }
    #ghosts { position: fixed; inset: 0; pointer-events: none; }
    .ghost { position: absolute; display: flex; flex-direction: column; align-items: center; padding-top: 6px; opacity: .28; }
    .ghost i { width: 40px; height: 40px; border-radius: 11px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .ghost b { width: 46px; height: 6px; margin-top: 8px; border-radius: 3px; background: #fff; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script>
  'use strict';
  /*
   * DiyarDesk · Liquid Glass Refractive Surface (WebGL2 Multi-Pass)
   * Two-zone optical refraction (convex crystal dome + high-refraction liquid lip),
   * 5-band spectral prismatic dispersion, 2-pass separable Gaussian frost blur,
   * superellipse SDF with polynomial smin liquid merging, and LCH directional sheen & inner glow.
   *
   * Optical refraction model & LCH pipeline inspired by:
   *   - @samasante/liquid-glass (MIT License, Copyright (c) Sam Asante)
   *     https://github.com/samasante/liquid-glass
   *   - iyinchao/liquid-glass-studio (MIT License, Copyright (c) 2024 Charles Yin)
   *     https://github.com/iyinchao/liquid-glass-studio
   *
   * share.js globals: cv, draw(), icons, W, H, WALL, cacheOK, frameN, paused, commit()
   */

  const QS = new URLSearchParams(location.search || '');
  const WALL = QS.has('wallpaper');
  const PREVIEW = QS.has('preview');
  let LOW = QS.get('low') === '1' || !!window.__desklandInitialLowMode || !!window.__desklandLowMode;

  const DEFAULTS = {
    palette: 'tahoe',
    refraction: 1.0,
    frostAmount: 0.65,
    dispersion: 0.95,
    mergeRate: 0.55,
    dropletCount: 1.0,
    flowSpeed: 0.85,
    cursorLens: true,
    iconGlassStyle: 'capsule',
    quality: 'High',
    adaptive: 1,
    seed: 0
  };
  const P = Object.assign({}, DEFAULTS);

  const PALETTE_INDEX = { tahoe: 0, aurora: 1, prism: 2, obsidian: 3, classic: 4 };
  const ICON_STYLE_INDEX = { capsule: 0, droplet: 1, prism: 2 };
  const QUALITY_PROFILES = {
    Low:    { maxDpr: 0.75, blurScale: 0.35, maxBlurTap: 8,  maxIcons: 24, maxDrops: 4 },
    Medium: { maxDpr: 1.15, blurScale: 0.50, maxBlurTap: 14, maxIcons: 36, maxDrops: 7 },
    High:   { maxDpr: 1.50, blurScale: 0.55, maxBlurTap: 18, maxIcons: 48, maxDrops: 9 }
  };

  function getProfile() {
    if (LOW || window.__desklandLowMode) return QUALITY_PROFILES.Low;
    return QUALITY_PROFILES[P.quality] || QUALITY_PROFILES.High;
  }

  const cv = document.getElementById('cv');
  let W = innerWidth || 1280;
  let H = innerHeight || 720;
  let icons = [];
  let _paused = false;
  let cacheOK = false;
  let frameN = 0;
  let rafId = 0;
  let lastT = 0;
  let simTime = 0;

  Object.defineProperty(window, 'paused', {
    configurable: true,
    enumerable: true,
    get: function () { return _paused; },
    set: function (v) { setPaused(v); }
  });

  function commit() {
    syncIconUniformBuffer();
  }

  // =========================================================================
  // SHADERS (WebGL2 GLSL ES 3.00)
  // =========================================================================
  const VERT_SRC = `#version 300 es
  in vec2 a_pos;
  out vec2 v_uv;
  void main() {
    v_uv = a_pos * 0.5 + 0.5;
    gl_Position = vec4(a_pos, 0.0, 1.0);
  }`;

  // Shared SDF + polynomial smin library (adapted from iyinchao/liquid-glass-studio, MIT)
  const SHARED_SDF_GLSL = `
  #define MAX_DROPS 10
  #define MAX_ICONS 48

  uniform vec2 u_resolution;
  uniform float u_dpr;
  uniform float u_mergePx;
  uniform int u_dropCount;
  uniform vec4 u_drops[MAX_DROPS];      // cx, cy, halfW, halfH (in CSS px, top-left origin)
  uniform float u_dropRound[MAX_DROPS]; // corner radius in CSS px
  uniform int u_cursorOn;
  uniform vec4 u_cursor;                // cx, cy, halfW, halfH (CSS px)
  uniform float u_cursorRadius;         // corner radius (CSS px)
  uniform int u_iconCount;
  uniform int u_iconStyle;              // 0: capsule, 1: droplet, 2: prism
  uniform vec4 u_icons[MAX_ICONS];      // cx, cy, halfW, halfH (CSS px)

  float smin(float a, float b, float k) {
    if (k <= 0.0001) return min(a, b);
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
  }

  float sdSuperellipseCorner(vec2 p, float r, float n) {
    p = abs(p);
    float v = pow(pow(p.x, n) + pow(p.y, n), 1.0 / n);
    return v - r;
  }

  float sdSquircleBox(vec2 p, vec2 c, vec2 halfSize, float cr, float n) {
    vec2 q = p - c;
    cr = min(cr, min(halfSize.x, halfSize.y));
    vec2 d = abs(q) - halfSize;
    if (d.x > -cr && d.y > -cr) {
      vec2 cc = sign(q) * (halfSize - vec2(cr));
      return sdSuperellipseCorner(q - cc, cr, n);
    }
    return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
  }

  float sdRoundBoxFast(vec2 p, vec2 c, vec2 halfSize, float cr) {
    vec2 q = abs(p - c) - (halfSize - vec2(cr));
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - cr;
  }

  // Evaluates signed distance in CSS pixels (negative inside glass)
  float sceneSDF(vec2 cssP) {
    float k = u_mergePx;
    float d = 1e5;

    // 1. Floating liquid glass droplets & smooth pill capsules
    for (int i = 0; i < MAX_DROPS; i++) {
      if (i >= u_dropCount) break;
      vec4 dr = u_drops[i];
      vec2 hs = dr.zw;
      vec2 bb = abs(cssP - dr.xy) - hs;
      float bound = max(bb.x, bb.y);
      if (bound < d + k * 2.2) {
        // Round droplets & smooth Apple pills (n = 2.25 gives organic liquid curvature)
        float sd = sdSquircleBox(cssP, dr.xy, hs, u_dropRound[i], 2.25);
        d = (d > 1e4) ? sd : smin(d, sd, k);
      }
    }

    // 2. Spring-physics cursor lens (organic liquid droplet/pill that merges via smin)
    if (u_cursorOn == 1) {
      vec2 hs = u_cursor.zw;
      vec2 bb = abs(cssP - u_cursor.xy) - hs;
      if (max(bb.x, bb.y) < d + k * 2.5) {
        float sd = sdSquircleBox(cssP, u_cursor.xy, hs, u_cursorRadius, 2.45);
        d = (d > 1e4) ? sd : smin(d, sd, k * 1.25);
      }
    }

    // 3. Adaptive desktop icon glass cradles
    float iconK = k * (u_iconStyle == 2 ? 0.35 : 0.72);
    for (int i = 0; i < MAX_ICONS; i++) {
      if (i >= u_iconCount) break;
      vec4 ic = u_icons[i];
      vec2 hs = ic.zw;
      vec2 bb = abs(cssP - ic.xy) - hs;
      if (max(bb.x, bb.y) < min(d, 120.0) + iconK * 2.2) {
        float sd;
        if (u_iconStyle == 1) {
          float rad = min(hs.x, hs.y) * 0.96;
          sd = sdSquircleBox(cssP, ic.xy, hs * 0.94, rad, 2.45);
        } else if (u_iconStyle == 2) {
          sd = sdRoundBoxFast(cssP, ic.xy, hs, 14.0);
        } else {
          sd = sdSquircleBox(cssP, ic.xy, hs, min(hs.x, hs.y) * 0.44, 3.4);
        }
        d = (d > 1e4) ? sd : smin(d, sd, iconK);
      }
    }

    return d;
  }
  `;

  // Pass 0: Pure high-contrast Apple macOS Tahoe / Studio silk-wave backdrop (unshadowed behind glass!)
  const BG_FRAG_SRC = `#version 300 es
  precision highp float;
  in vec2 v_uv;
  out vec4 fragColor;

  uniform float u_time;
  uniform int u_palette;
  uniform float u_shadowFactor;
  ${SHARED_SDF_GLSL}

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float sdCapsule2D(vec2 p, vec2 a, vec2 b, float r) {
    vec2 pa = p - a;
    vec2 ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);
    return length(pa - ba * h) - r;
  }

  vec3 drawStudioSphere(vec3 col, vec2 p, vec2 c, float r, vec3 baseA, vec3 baseB, vec3 rimCol, float pxSize) {
    vec2 q = p - c;
    float d = length(q);

    float sdSh = length(p - (c + vec2(0.014, -0.022))) - r;
    float sh = exp(-max(sdSh, 0.0) * 26.0) * 0.28;
    col *= (1.0 - sh * smoothstep(-pxSize, r * 0.35, d - r));

    if (d < r + pxSize * 2.0) {
      float rn = clamp(d / r, 0.0, 1.0);
      float z = sqrt(max(0.0, 1.0 - rn * rn));
      vec3 n = normalize(vec3(q / r, z));
      vec3 keyL = normalize(vec3(-0.52, 0.62, 0.68));
      vec3 fillL = normalize(vec3(0.65, -0.45, 0.50));
      vec3 viewV = vec3(0.0, 0.0, 1.0);

      float diff = clamp(dot(n, keyL) * 0.68 + 0.34, 0.0, 1.0);
      float fill = clamp(dot(n, fillL), 0.0, 1.0) * 0.32;
      vec3 hVec = normalize(keyL + viewV);
      float spec = pow(max(dot(n, hVec), 0.0), 42.0) * 0.85;
      float specBroad = pow(max(dot(n, hVec), 0.0), 9.0) * 0.22;
      float fres = pow(1.0 - max(n.z, 0.0), 3.0);

      vec3 sph = mix(baseA, baseB, clamp(0.5 + 0.5 * (n.x * 0.55 - n.y * 0.72), 0.0, 1.0));
      sph = sph * (0.48 + 0.68 * diff) + rimCol * fill * 0.45;
      sph += rimCol * fres * 0.58;
      sph += vec3(1.0) * (spec + specBroad);

      float rimLine = smoothstep(0.86, 0.99, rn) * (0.35 + 0.65 * max(dot(normalize(q + 1e-5), vec2(-0.55, 0.65)), 0.0));
      sph = mix(sph, vec3(1.0), rimLine * 0.42);

      float mask = 1.0 - smoothstep(r - pxSize, r + pxSize, d);
      col = mix(col, clamp(sph, 0.0, 1.0), mask);
    }
    return col;
  }

  vec3 drawStudioCapsule(vec3 col, vec2 p, vec2 a, vec2 b, float r, vec3 cA, vec3 cB, vec3 hiCol, float pxSize) {
    vec2 pa = p - a;
    vec2 ba = b - a;
    float ba2 = max(dot(ba, ba), 1e-5);
    float tAlong = clamp(dot(pa, ba) / ba2, 0.0, 1.0);
    vec2 closest = a + ba * tAlong;
    vec2 perp = p - closest;
    float d = length(perp) - r;

    float dSh = sdCapsule2D(p - vec2(0.012, -0.020), a, b, r);
    float sh = exp(-max(dSh, 0.0) * 28.0) * 0.26;
    col *= (1.0 - sh * smoothstep(-pxSize, r * 0.45, d));

    if (d < pxSize * 2.0) {
      vec2 n2 = perp / max(r, 1e-4);
      float rn = clamp(length(n2), 0.0, 1.0);
      float z = sqrt(max(0.0, 1.0 - rn * rn));
      vec3 n = normalize(vec3(n2, z));
      vec3 keyL = normalize(vec3(-0.48, 0.68, 0.62));
      float diff = clamp(dot(n, keyL) * 0.62 + 0.42, 0.0, 1.0);
      float spec = pow(max(dot(n, normalize(keyL + vec3(0.0, 0.0, 1.0))), 0.0), 26.0) * 0.65;
      float fres = pow(1.0 - max(n.z, 0.0), 2.6);

      vec3 cap = mix(cA, cB, tAlong) * (0.52 + 0.58 * diff);
      cap += hiCol * fres * 0.48 + vec3(1.0) * spec;
      float edgeHi = smoothstep(r - pxSize * 3.0, r - pxSize * 0.4, length(perp));
      cap = mix(cap, mix(hiCol, vec3(1.0), 0.65), edgeHi * 0.48);

      float mask = 1.0 - smoothstep(-pxSize, pxSize, d);
      col = mix(col, clamp(cap, 0.0, 1.0), mask);
    }
    return col;
  }

  vec3 drawOpticalRing(vec3 col, vec2 p, vec2 c, float radius, float halfThick, vec3 ringA, vec3 ringB, float pxSize) {
    vec2 q = p - c;
    float dist = length(q);
    float ringD = abs(dist - radius) - halfThick;

    float glow = exp(-max(ringD, 0.0) * 44.0) * 0.24;
    float ang = atan(q.y, q.x);
    vec3 rCol = mix(ringA, ringB, 0.5 + 0.5 * sin(ang - 0.8));
    col += rCol * glow;

    if (ringD < pxSize * 2.0) {
      float core = 1.0 - smoothstep(-pxSize, pxSize, ringD);
      float highlight = 0.72 + 0.28 * cos(ang - 2.2);
      vec3 body = mix(rCol, vec3(1.0), 0.42 * highlight);
      col = mix(col, clamp(body, 0.0, 1.0), core * 0.92);
    }
    return col;
  }

  vec3 addStudioObjects(vec3 col, vec2 p, float t, int pal, float pxSize) {
    vec3 objA, objB, objC, objAccent, ringCol1, ringCol2, dotCol;
    if (pal == 0) {
      objA      = vec3(0.06, 0.36, 0.86);
      objB      = vec3(0.10, 0.86, 0.88);
      objC      = vec3(0.96, 0.54, 0.32);
      objAccent = vec3(0.92, 0.98, 1.00);
      ringCol1  = vec3(0.58, 0.96, 1.00);
      ringCol2  = vec3(0.32, 0.68, 1.00);
      dotCol    = vec3(0.82, 0.96, 1.00);
    } else if (pal == 1) {
      objA      = vec3(0.38, 0.16, 0.88);
      objB      = vec3(0.10, 0.92, 0.86);
      objC      = vec3(0.98, 0.30, 0.72);
      objAccent = vec3(0.92, 0.96, 1.00);
      ringCol1  = vec3(0.42, 0.98, 0.94);
      ringCol2  = vec3(1.00, 0.48, 0.86);
      dotCol    = vec3(0.86, 0.94, 1.00);
    } else if (pal == 2) {
      objA      = vec3(0.86, 0.24, 0.42);
      objB      = vec3(1.00, 0.72, 0.24);
      objC      = vec3(0.28, 0.78, 0.96);
      objAccent = vec3(1.00, 0.96, 0.86);
      ringCol1  = vec3(1.00, 0.88, 0.58);
      ringCol2  = vec3(1.00, 0.48, 0.58);
      dotCol    = vec3(1.00, 0.94, 0.86);
    } else if (pal == 3) {
      objA      = vec3(0.18, 0.24, 0.34);
      objB      = vec3(0.62, 0.74, 0.88);
      objC      = vec3(0.36, 0.68, 0.96);
      objAccent = vec3(0.94, 0.97, 1.00);
      ringCol1  = vec3(0.86, 0.92, 1.00);
      ringCol2  = vec3(0.45, 0.64, 0.86);
      dotCol    = vec3(0.84, 0.90, 0.98);
    } else {
      objA      = vec3(0.12, 0.46, 0.96);
      objB      = vec3(0.14, 0.90, 0.78);
      objC      = vec3(0.98, 0.66, 0.28);
      objAccent = vec3(0.92, 0.98, 1.00);
      ringCol1  = vec3(0.72, 0.97, 1.00);
      ringCol2  = vec3(0.28, 0.76, 1.00);
      dotCol    = vec3(0.84, 0.96, 1.00);
    }

    float cell = 0.072;
    vec2 gId = floor(p / cell + 0.5);
    vec2 gLocal = p - gId * cell;
    float dotDist = length(gLocal);
    float dotMask = 1.0 - smoothstep(0.0018, 0.0018 + pxSize * 1.1, dotDist);
    vec2 majorMod = abs(mod(gId + 2.0, 4.0) - 2.0);
    float isMajor = step(1.5, majorMod.x) * step(1.5, majorMod.y);
    float crossD = min(
      max(abs(gLocal.x) - 0.0060, abs(gLocal.y) - 0.0009),
      max(abs(gLocal.y) - 0.0060, abs(gLocal.x) - 0.0009)
    );
    float crossMask = (1.0 - smoothstep(-pxSize * 0.6, pxSize * 0.9, crossD)) * isMajor;
    col = mix(col, dotCol, clamp(dotMask * 0.19 + crossMask * 0.16, 0.0, 0.32));

    vec2 r1c = vec2(-0.56 + 0.024 * sin(t * 0.18),  0.08 + 0.026 * cos(t * 0.15));
    vec2 r2c = vec2( 0.04 + 0.030 * cos(t * 0.14),  0.00 + 0.024 * sin(t * 0.17));
    vec2 r3c = vec2( 0.56 + 0.025 * sin(t * 0.16 + 1.4), -0.06 + 0.028 * cos(t * 0.14));
    col = drawOpticalRing(col, p, r1c, 0.215, 0.0034, ringCol1, ringCol2, pxSize);
    col = drawOpticalRing(col, p, r2c, 0.295, 0.0040, ringCol2, objC,     pxSize);
    col = drawOpticalRing(col, p, r3c, 0.195, 0.0032, ringCol1, objAccent, pxSize);

    float s1 = 0.016 * sin(t * 0.20);
    float s2 = 0.018 * cos(t * 0.16 + 0.9);
    float s3 = 0.016 * sin(t * 0.18 + 2.1);
    float s4 = 0.015 * cos(t * 0.21 + 3.2);

    col = drawStudioCapsule(col, p, vec2(-0.84,  0.34 + s1), vec2(-0.48,  0.05 + s1), 0.044, objA, objB, objAccent, pxSize);
    col = drawStudioCapsule(col, p, vec2(-0.20,  0.29 + s2), vec2( 0.24,  0.17 + s2), 0.048, objC, objB, objAccent, pxSize);
    col = drawStudioCapsule(col, p, vec2(-0.46, -0.29 + s3), vec2( 0.06, -0.19 + s3), 0.042, objB, objA, ringCol1,  pxSize);
    col = drawStudioCapsule(col, p, vec2( 0.36, -0.31 + s4), vec2( 0.80,  0.14 + s4), 0.046, objA, objC, objAccent, pxSize);

    col = drawStudioSphere(col, p, vec2(-0.69 + 0.020 * cos(t * 0.22), -0.19 + 0.022 * sin(t * 0.18)), 0.088, objC, objB, objAccent, pxSize);
    col = drawStudioSphere(col, p, vec2(-0.26 + 0.022 * sin(t * 0.17 + 1.2), -0.02 + 0.020 * cos(t * 0.20)), 0.106, objA, objB, ringCol1,  pxSize);
    col = drawStudioSphere(col, p, vec2( 0.22 + 0.020 * cos(t * 0.15 + 2.4), -0.18 + 0.018 * sin(t * 0.19)), 0.078, objC, objA, objAccent, pxSize);
    col = drawStudioSphere(col, p, vec2( 0.45 + 0.022 * sin(t * 0.19 + 0.6),  0.25 + 0.022 * cos(t * 0.16)), 0.098, objB, objC, objAccent, pxSize);

    return col;
  }

  vec3 paletteBackdrop(vec2 uv, float t, int pal) {
    float asp = u_resolution.x / max(1.0, u_resolution.y);
    vec2 p = (uv - 0.5) * vec2(asp, 1.0);
    float pxSize = 1.15 / max(1.0, u_resolution.y);

    // Classic Silk (calm blue/teal waves + studio optical objects)
    if (pal == 4) {
      vec3 col = vec3(0.032, 0.105, 0.220);
      vec3 lobes[4];
      lobes[0] = vec3(0.180, 0.720, 0.980);
      lobes[1] = vec3(0.140, 0.850, 0.760);
      lobes[2] = vec3(0.240, 0.480, 0.980);
      lobes[3] = vec3(0.760, 0.930, 1.000);
      for (int i = 0; i < 4; i++) {
        float fi = float(i);
        vec2 c = vec2(
          0.18 + 0.22 * fi + sin(t * (0.40 + fi * 0.10) + fi * 1.3) * 0.18,
          0.50 + cos(t * (0.34 + fi * 0.12) + fi * 1.7) * 0.34
        );
        vec2 dv = (uv - c) * vec2(asp, 1.0);
        float rad = (0.46 + 0.08 * fi) * max(asp, 1.0);
        float a = clamp(1.0 - length(dv) / rad, 0.0, 1.0);
        a = a * a * (3.0 - 2.0 * a) * 0.68;
        col = mix(col, lobes[i], a);
      }
      float wave = sin((p.x * 0.75 + p.y * 0.66) * 10.5 + 1.4 * sin(p.y * 3.0 - t * 0.32));
      col += vec3(0.84, 0.96, 1.0) * smoothstep(0.65, 0.98, wave) * 0.18;
      col = addStudioObjects(col, p, t, pal, pxSize);
      col += (hash21(gl_FragCoord.xy) - 0.5) * (1.2 / 255.0);
      return clamp(col, 0.0, 1.0);
    }

    // Apple macOS Tahoe / iOS 26 style sculpted sweeping glass silk layers
    vec2 w = p;
    w.x += 0.16 * sin(p.y * 2.1 + t * 0.32) + 0.06 * cos(p.x * 2.8 - t * 0.22);
    w.y += 0.14 * cos(p.x * 1.9 - t * 0.27) + 0.05 * sin(p.y * 3.1 + t * 0.19);

    float curve1 = w.y - (0.16 * sin(w.x * 2.1 + t * 0.34) + 0.06 * cos(w.x * 3.8 - t * 0.22) + 0.20);
    float curve2 = w.y - (0.19 * cos(w.x * 1.7 - t * 0.28 + 1.1) - 0.04 * sin(w.x * 3.2 + t * 0.21) - 0.02);
    float curve3 = w.y - (0.15 * sin(w.x * 2.4 + t * 0.24 + 2.5) - 0.24);

    float layer1 = smoothstep(-0.015, 0.015, -curve1);
    float layer2 = smoothstep(-0.015, 0.015, -curve2);
    float layer3 = smoothstep(-0.015, 0.015, -curve3);

    float edge1 = exp(-abs(curve1) * 34.0) * 0.65 + exp(-abs(curve1) * 10.0) * 0.22;
    float edge2 = exp(-abs(curve2) * 32.0) * 0.62 + exp(-abs(curve2) * 9.0) * 0.24;
    float edge3 = exp(-abs(curve3) * 30.0) * 0.56 + exp(-abs(curve3) * 9.0) * 0.20;

    float silkRipple = sin(curve2 * 38.0 + 1.2 * sin(w.x * 3.4 - t * 0.24));
    float silkSheen = pow(0.5 + 0.5 * silkRipple, 8.0) * 0.14;

    vec2 orb1 = vec2(0.42 * sin(t * 0.20 + 0.4), 0.24 * cos(t * 0.16));
    vec2 orb2 = vec2(-0.48 * cos(t * 0.17 + 1.6), -0.18 * sin(t * 0.22));
    float d1 = length(p - orb1);
    float d2 = length(p - orb2);
    float bloom1 = exp(-d1 * d1 * 4.5) * 0.36;
    float bloom2 = exp(-d2 * d2 * 5.2) * 0.32;

    vec3 c0, c1, c2, c3, hi1, hi2;
    if (pal == 0) {
      c0  = vec3(0.018, 0.068, 0.185);
      c1  = vec3(0.035, 0.215, 0.485);
      c2  = vec3(0.055, 0.485, 0.695);
      c3  = vec3(0.245, 0.790, 0.935);
      hi1 = vec3(0.840, 0.980, 1.000);
      hi2 = vec3(0.280, 0.955, 0.875);
    } else if (pal == 1) {
      c0  = vec3(0.030, 0.022, 0.125);
      c1  = vec3(0.215, 0.075, 0.445);
      c2  = vec3(0.065, 0.485, 0.690);
      c3  = vec3(0.880, 0.255, 0.665);
      hi1 = vec3(0.620, 0.985, 1.000);
      hi2 = vec3(1.000, 0.630, 0.890);
    } else if (pal == 2) {
      c0  = vec3(0.085, 0.038, 0.155);
      c1  = vec3(0.455, 0.130, 0.335);
      c2  = vec3(0.895, 0.355, 0.290);
      c3  = vec3(0.990, 0.745, 0.345);
      hi1 = vec3(1.000, 0.945, 0.780);
      hi2 = vec3(0.420, 0.855, 1.000);
    } else {
      c0  = vec3(0.020, 0.025, 0.042);
      c1  = vec3(0.065, 0.092, 0.148);
      c2  = vec3(0.135, 0.195, 0.285);
      c3  = vec3(0.340, 0.435, 0.560);
      hi1 = vec3(0.900, 0.950, 1.000);
      hi2 = vec3(0.500, 0.720, 0.950);
    }

    vec3 col = mix(c0, c1, clamp(uv.y * 0.9 + 0.12, 0.0, 1.0));
    vec3 waveCol1 = mix(c1, c2, clamp(0.45 + curve1 * 1.4, 0.0, 1.0));
    vec3 waveCol2 = mix(c2, c3, clamp(0.40 + curve2 * 1.4, 0.0, 1.0));
    vec3 waveCol3 = mix(c0, c2, clamp(0.55 + curve3 * 1.6, 0.0, 1.0));

    col = mix(col, waveCol1, layer1 * 0.86);
    col = mix(col, waveCol2, layer2 * 0.82);
    col = mix(col, waveCol3, layer3 * 0.78);

    col *= 1.0 - smoothstep(0.0, 0.12, curve1) * exp(-max(curve1, 0.0) * 14.0) * 0.28;
    col *= 1.0 - smoothstep(0.0, 0.12, curve2) * exp(-max(curve2, 0.0) * 14.0) * 0.28;
    col *= 1.0 - smoothstep(0.0, 0.12, curve3) * exp(-max(curve3, 0.0) * 14.0) * 0.26;

    col += hi1 * edge1 * 0.42;
    col += hi2 * edge2 * 0.38;
    col += mix(hi1, hi2, 0.5) * edge3 * 0.34;
    col += mix(hi1, vec3(1.0), 0.5) * silkSheen;
    col += hi1 * bloom1 * 0.75 + hi2 * bloom2 * 0.75;

    col = addStudioObjects(col, p, t, pal, pxSize);

    float vig = 1.0 - dot(p * vec2(0.46, 0.62), p * vec2(0.46, 0.62)) * 0.30;
    col *= clamp(vig, 0.74, 1.04);
    col += (hash21(gl_FragCoord.xy) - 0.5) * (1.2 / 255.0);
    return clamp(col, 0.0, 1.0);
  }

  void main() {
    vec3 bg = paletteBackdrop(v_uv, u_time, u_palette);
    fragColor = vec4(bg, 1.0);
  }`;

  // Pass 1 & 2: Separable Gaussian Blur (adapted from iyinchao/liquid-glass-studio, MIT)
  const BLUR_FRAG_SRC = `#version 300 es
  precision highp float;
  #define MAX_TAP 24
  in vec2 v_uv;
  out vec4 fragColor;

  uniform sampler2D u_tex;
  uniform vec2 u_texelDir; // (1/w, 0) or (0, 1/h)
  uniform int u_radius;
  uniform float u_weights[MAX_TAP + 1];

  void main() {
    vec4 sum = texture(u_tex, v_uv) * u_weights[0];
    for (int i = 1; i <= MAX_TAP; i++) {
      if (i > u_radius) break;
      float w = u_weights[i];
      vec2 off = u_texelDir * float(i);
      sum += texture(u_tex, v_uv + off) * w;
      sum += texture(u_tex, v_uv - off) * w;
    }
    fragColor = sum;
  }`;

  // Pass 3: True Crease-Free Liquid Glass Composite (@samasante/liquid-glass lip/dome optics + 5-band spectral dispersion + LCH sheen/glow)
  const MAIN_FRAG_SRC = `#version 300 es
  precision highp float;
  #define PI 3.14159265359

  in vec2 v_uv;
  out vec4 fragColor;

  uniform sampler2D u_bg;
  uniform sampler2D u_blurredBg;
  uniform float u_refraction;   // 0.2 .. 1.6
  uniform float u_frost;        // 0.0 .. 1.5
  uniform float u_dispersion;   // 0.0 .. 1.6
  uniform vec4 u_tint;          // glass tint rgba
  uniform float u_glareAngle;   // light angle radians

  ${SHARED_SDF_GLSL}

  float safeAsin(float x) {
    return asin(clamp(x, -1.0, 1.0));
  }

  const vec3 D65_WHITE = vec3(0.95045592705, 1.0, 1.08905775076);
  const mat3 RGB_TO_XYZ_M = mat3(
    0.4124, 0.3576, 0.1805,
    0.2126, 0.7152, 0.0722,
    0.0193, 0.1192, 0.9505
  );
  const mat3 XYZ_TO_RGB_M = mat3(
     3.2406255, -1.537208 , -0.4986286,
    -0.9689307,  1.8757561,  0.0415175,
     0.0557101, -0.2040211,  1.0569959
  );
  float UNCOMPAND_SRGB(float a) { return a > 0.04045 ? pow((a + 0.055) / 1.055, 2.4) : a / 12.92; }
  float COMPAND_RGB(float a) { return a <= 0.0031308 ? 12.92 * a : 1.055 * pow(max(a, 0.0), 0.41666666666) - 0.055; }
  vec3 SRGB_TO_XYZ(vec3 s) { return vec3(UNCOMPAND_SRGB(s.x), UNCOMPAND_SRGB(s.y), UNCOMPAND_SRGB(s.z)) * RGB_TO_XYZ_M; }
  vec3 XYZ_TO_SRGB(vec3 x) {
    vec3 r = x * XYZ_TO_RGB_M;
    return clamp(vec3(COMPAND_RGB(r.x), COMPAND_RGB(r.y), COMPAND_RGB(r.z)), 0.0, 1.0);
  }
  float XYZ_TO_LAB_F(float x) { return x > 0.00885645167 ? pow(x, 0.333333333) : 7.78703703704 * x + 0.13793103448; }
  float LAB_TO_XYZ_F(float x) { return x > 0.206897 ? x * x * x : 0.12841854934 * (x - 0.137931034); }
  vec3 SRGB_TO_LCH(vec3 srgb) {
    vec3 xyz = SRGB_TO_XYZ(srgb) / D65_WHITE;
    vec3 f = vec3(XYZ_TO_LAB_F(xyz.x), XYZ_TO_LAB_F(xyz.y), XYZ_TO_LAB_F(xyz.z));
    vec3 lab = vec3(116.0 * f.y - 16.0, 500.0 * (f.x - f.y), 200.0 * (f.y - f.z));
    return vec3(lab.x, sqrt(dot(lab.yz, lab.yz)), atan(lab.z, lab.y));
  }
  vec3 LCH_TO_SRGB(vec3 lch) {
    vec3 lab = vec3(lch.x, lch.y * cos(lch.z), lch.y * sin(lch.z));
    float w = (lab.x + 16.0) / 116.0;
    vec3 xyz = D65_WHITE * vec3(LAB_TO_XYZ_F(w + lab.y / 500.0), LAB_TO_XYZ_F(w), LAB_TO_XYZ_F(w - lab.z / 200.0));
    return XYZ_TO_SRGB(xyz);
  }

  vec2 getSmoothGradientCSS(vec2 cssP, float e) {
    vec2 e1 = vec2( 1.0,  1.0);
    vec2 e2 = vec2(-1.0,  1.0);
    vec2 e3 = vec2( 1.0, -1.0);
    vec2 e4 = vec2(-1.0, -1.0);
    return (e1 * sceneSDF(cssP + e * e1)
          + e2 * sceneSDF(cssP + e * e2)
          + e3 * sceneSDF(cssP + e * e3)
          + e4 * sceneSDF(cssP + e * e4)) / (4.0 * e);
  }

  vec3 sampleLayer(vec2 uv, float blurMix) {
    vec2 suv = clamp(uv, vec2(0.001), vec2(0.999));
    vec3 sharp = texture(u_bg, suv).rgb;
    if (blurMix <= 0.005) return sharp;
    vec3 soft = texture(u_blurredBg, suv).rgb;
    return mix(sharp, soft, blurMix);
  }

  vec3 sampleSpectralDispersion(vec2 uv, vec2 uvOffset, float blurMix, float spread) {
    if (spread <= 0.001) {
      return sampleLayer(uv + uvOffset, blurMix);
    }
    vec3 cR = sampleLayer(uv + uvOffset * (1.0 - spread * 1.00), blurMix);
    vec3 cY = sampleLayer(uv + uvOffset * (1.0 - spread * 0.45), blurMix);
    vec3 cG = sampleLayer(uv + uvOffset,                        blurMix);
    vec3 cC = sampleLayer(uv + uvOffset * (1.0 + spread * 0.45), blurMix);
    vec3 cB = sampleLayer(uv + uvOffset * (1.0 + spread * 1.00), blurMix);

    float r = cR.r * 0.62 + cY.r * 0.38;
    float g = cY.g * 0.24 + cG.g * 0.52 + cC.g * 0.24;
    float b = cC.b * 0.38 + cB.b * 0.62;
    return vec3(r, g, b);
  }

  void main() {
    vec2 res1x = u_resolution / u_dpr;
    vec2 cssP = vec2(gl_FragCoord.x, u_resolution.y - gl_FragCoord.y) / u_dpr;
    vec3 bgPixel = texture(u_bg, v_uv).rgb;

    float d = sceneSDF(cssP);

    float dShadow = sceneSDF(cssP - vec2(0.0, 9.0));
    float outerShadow = exp(-max(dShadow, 0.0) / 24.0) * 0.32;
    float contactAO = exp(-max(dShadow, 0.0) / 6.0) * 0.20;
    float shadowMask = smoothstep(-1.5, 2.5, d);
    vec3 shadowedBg = bgPixel * (1.0 - clamp(outerShadow + contactAO, 0.0, 0.52) * shadowMask);
    float causticBand = exp(-pow((dShadow - 4.0) / 8.5, 2.0)) * 0.08 * shadowMask * clamp(u_refraction, 0.0, 1.5);
    shadowedBg = min(vec3(1.0), shadowedBg + mix(vec3(1.0), u_tint.rgb, 0.4) * causticBand);

    if (d > 2.2) {
      fragColor = vec4(shadowedBg, 1.0);
      return;
    }

    float depthPx = max(0.0, -d);

    vec2 gRim = getSmoothGradientCSS(cssP, 1.1);
    float gRimLen = length(gRim);
    vec2 rimNormalCSS = gRimLen > 1e-4 ? (gRim / gRimLen) : vec2(0.0, 1.0);
    vec2 rimNormalUV = vec2(rimNormalCSS.x, -rimNormalCSS.y);

    vec2 gLens = getSmoothGradientCSS(cssP, 2.4);
    float gLensLen = length(gLens);
    vec2 lipNormalUV = vec2(gLens.x, -gLens.y) * smoothstep(0.42, 0.96, gLensLen);

    vec2 gDome = getSmoothGradientCSS(cssP, 7.5);
    float gDomeLen = length(gDome);
    vec2 domeNormalUV = vec2(gDome.x, -gDome.y) * smoothstep(0.50, 0.98, gDomeLen);

    float lipWidth = 9.5 + 5.5 * u_refraction;
    float uLip = clamp(depthPx / lipWidth, 0.0, 1.0);
    float sLip = 1.0 - uLip;
    float lipEnvelope = sLip * sLip * (3.0 - 2.0 * sLip);
    float ior = 1.38 + 0.42 * u_refraction;
    float thetaI = safeAsin(pow(sLip, 1.25));
    float thetaT = safeAsin(sin(thetaI) / ior);
    float snellSlope = (depthPx >= lipWidth) ? 0.0 : max(0.0, -tan(thetaT - thetaI));
    float lipBend = snellSlope * lipEnvelope * (1.0 + 1.35 * pow(sLip, 2.5));

    float domeFalloff = exp(-depthPx / (18.0 + 10.0 * u_refraction));
    vec2 dispVecPx = (lipNormalUV * (lipBend * 48.0) + domeNormalUV * (domeFalloff * 8.5)) * u_refraction;
    vec2 uvOff = -dispVecPx / res1x;

    float interiorFrost = clamp(u_frost * 0.24, 0.0, 0.72);
    float blurRate = mix(interiorFrost * 0.05, interiorFrost, smoothstep(0.15, 0.95, uLip));

    float dispScale = (u_iconStyle == 2 ? 0.26 : 0.20) * u_dispersion;
    float spread = dispScale * (0.06 + 1.42 * lipEnvelope);

    vec3 glassCol = sampleSpectralDispersion(v_uv, uvOff, blurRate, spread);

    glassCol = mix(glassCol, u_tint.rgb, u_tint.a * 0.24);
    vec3 baseLch = SRGB_TO_LCH(glassCol);
    baseLch.x = clamp(baseLch.x + 2.8, 0.0, 100.0);
    baseLch.y = clamp(baseLch.y * 1.07, 0.0, 128.0);
    glassCol = LCH_TO_SRGB(baseLch);

    float innerDarkBand = exp(-pow((depthPx - 3.6) / 2.2, 2.0)) * 0.11 * clamp(u_refraction, 0.3, 1.5);
    glassCol *= (1.0 - innerDarkBand);

    float innerGlow = exp(-depthPx / 11.5) * (0.14 + 0.09 * u_refraction);
    vec3 glowCol = mix(vec3(1.0), u_tint.rgb, 0.32);
    glassCol = mix(glassCol, max(glassCol, glowCol), clamp(innerGlow * 0.52, 0.0, 0.30));

    float ang = atan(rimNormalUV.y, rimNormalUV.x);
    if (ang < 0.0) ang += 2.0 * PI;
    float keyDir = cos(ang - (PI * 0.72 - u_glareAngle));
    float oppDir = cos(ang - (PI * 1.72 - u_glareAngle));
    float primarySheen = pow(max(keyDir, 0.0), 2.5);
    float secondarySheen = pow(max(oppDir, 0.0), 3.8) * 0.58;
    float sheenDir = clamp(primarySheen + secondarySheen, 0.0, 1.0);

    float sheenBand = clamp(pow(clamp(1.0 - depthPx / 13.0 + 0.04, 0.0, 1.0), 4.4), 0.0, 1.0);
    vec3 sheenLCH = SRGB_TO_LCH(mix(glassCol, vec3(1.0), 0.45));
    sheenLCH.x = clamp(sheenLCH.x + 88.0 * sheenDir * sheenBand, 0.0, 100.0);
    sheenLCH.y = clamp(sheenLCH.y * (1.0 - 0.45 * sheenDir * sheenBand), 0.0, 120.0);
    glassCol = mix(glassCol, LCH_TO_SRGB(sheenLCH), clamp(sheenDir * sheenBand * 0.86, 0.0, 0.92));

    float topArc = smoothstep(0.25, 0.95, keyDir) * exp(-depthPx / 20.0) * 0.09 * smoothstep(0.25, 0.95, gRimLen);
    glassCol = min(vec3(1.0), glassCol + vec3(topArc));

    float bevel = smoothstep(2.2, 0.35, depthPx) * (0.28 + 0.72 * sheenDir);
    glassCol = mix(glassCol, vec3(1.0), clamp(bevel * 0.84, 0.0, 0.90));

    float aa = max(0.75, 1.1 / max(u_dpr, 0.5));
    float mask = 1.0 - smoothstep(-aa, aa, d);
    fragColor = vec4(mix(shadowedBg, glassCol, mask), 1.0);
  }`;

  // =========================================================================
  // WEBGL2 MULTI-PASS RENDERER
  // =========================================================================
  const gl = cv.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: true,
    powerPreference: 'default'
  });

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('LiquidGlass shader error:', gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function linkProgram(vSrc, fSrc) {
    const vs = compileShader(gl.VERTEX_SHADER, vSrc);
    const fs = compileShader(gl.FRAGMENT_SHADER, fSrc);
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error('LiquidGlass link error:', gl.getProgramInfoLog(p));
      gl.deleteProgram(p);
      return null;
    }
    return p;
  }

  function makeFBO(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex, w, h };
  }

  function freeFBO(obj) {
    if (!obj) return;
    if (obj.fbo) gl.deleteFramebuffer(obj.fbo);
    if (obj.tex) gl.deleteTexture(obj.tex);
  }

  function computeGaussianWeights(radius) {
    const arr = new Float32Array(25);
    const r = Math.max(0, Math.min(24, radius | 0));
    if (r === 0) { arr[0] = 1; return arr; }
    const sigma = Math.max(1.0, r * 0.45);
    let sum = 1.0;
    arr[0] = 1.0;
    for (let i = 1; i <= r; i++) {
      const w = Math.exp(-(i * i) / (2.0 * sigma * sigma));
      arr[i] = w;
      sum += 2.0 * w;
    }
    for (let i = 0; i <= r; i++) arr[i] /= sum;
    return arr;
  }

  let progBg = null, progBlur = null, progMain = null;
  let quadVAO = null;
  let fboBg = null, fboBlurA = null, fboBlurB = null;
  let uBg = {}, uBlur = {}, uMain = {};
  let glReady = false;

  function cacheUniforms(prog, names) {
    const out = {};
    for (const n of names) out[n] = gl.getUniformLocation(prog, n);
    return out;
  }

  function initGL() {
    if (!gl) return false;
    progBg = linkProgram(VERT_SRC, BG_FRAG_SRC);
    progBlur = linkProgram(VERT_SRC, BLUR_FRAG_SRC);
    progMain = linkProgram(VERT_SRC, MAIN_FRAG_SRC);
    if (!progBg || !progBlur || !progMain) return false;

    quadVAO = gl.createVertexArray();
    gl.bindVertexArray(quadVAO);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    const sharedNames = [
      'u_resolution', 'u_dpr', 'u_mergePx',
      'u_dropCount', 'u_drops', 'u_dropRound',
      'u_cursorOn', 'u_cursor', 'u_cursorRadius',
      'u_iconCount', 'u_iconStyle', 'u_icons'
    ];
    uBg = cacheUniforms(progBg, sharedNames.concat(['u_time', 'u_palette', 'u_shadowFactor']));
    uBlur = cacheUniforms(progBlur, ['u_tex', 'u_texelDir', 'u_radius', 'u_weights']);
    uMain = cacheUniforms(progMain, sharedNames.concat([
      'u_bg', 'u_blurredBg', 'u_refraction', 'u_frost', 'u_dispersion', 'u_tint', 'u_glareAngle'
    ]));
    glReady = true;
    return true;
  }

  function rebuildFBOs(pw, ph) {
    if (!glReady) return;
    freeFBO(fboBg); freeFBO(fboBlurA); freeFBO(fboBlurB);
    const prof = getProfile();
    const bw = Math.max(64, Math.round(pw * prof.blurScale));
    const bh = Math.max(64, Math.round(ph * prof.blurScale));
    fboBg = makeFBO(pw, ph);
    fboBlurA = makeFBO(bw, bh);
    fboBlurB = makeFBO(bw, bh);
  }

  // =========================================================================
  // FLOATING LIQUID GLASS DROPLETS, SPRING CURSOR LENS & ICON CRADLES
  // =========================================================================
  const MAX_DROPS = 10;
  const MAX_ICONS = 48;
  const dropsData = new Float32Array(MAX_DROPS * 4);
  const dropsRound = new Float32Array(MAX_DROPS);
  const iconsData = new Float32Array(MAX_ICONS * 4);
  let activeIconCount = 0;

  // Deterministic fluid glass droplets (circles & pills that drift and merge via smin)
  const drops = [];
  (function initDrops() {
    const specs = [
      { ux: 0.72, uy: 0.34, rx: 88, ry: 54, rd: 46, vx: 19, vy: 11, ph: 0.4 },
      { ux: 0.62, uy: 0.56, rx: 56, ry: 56, rd: 56, vx: -16, vy: 14, ph: 1.7 },
      { ux: 0.82, uy: 0.68, rx: 46, ry: 82, rd: 46, vx: -12, vy: -17, ph: 2.9 },
      { ux: 0.44, uy: 0.28, rx: 64, ry: 44, rd: 38, vx: 15, vy: -13, ph: 4.1 },
      { ux: 0.52, uy: 0.74, rx: 74, ry: 42, rd: 42, vx: -20, vy: -9, ph: 5.2 },
      { ux: 0.34, uy: 0.54, rx: 44, ry: 44, rd: 44, vx: 14, vy: 16, ph: 0.9 },
      { ux: 0.76, uy: 0.20, rx: 48, ry: 48, rd: 48, vx: -18, vy: 12, ph: 3.3 },
      { ux: 0.28, uy: 0.78, rx: 58, ry: 38, rd: 36, vx: 17, vy: -14, ph: 2.1 },
      { ux: 0.66, uy: 0.44, rx: 38, ry: 38, rd: 38, vx: -14, vy: -15, ph: 4.8 },
      { ux: 0.48, uy: 0.46, rx: 52, ry: 52, rd: 52, vx: 12, vy: 18, ph: 1.1 }
    ];
    for (const s of specs) {
      drops.push(Object.assign({ x: W * s.ux, y: H * s.uy }, s));
    }
  })();

  // Spring-physics cursor glass lens (stretches smoothly along motion vector)
  const cursorState = {
    active: false,
    tx: W * 0.55,
    ty: H * 0.48,
    x: W * 0.55,
    y: H * 0.48,
    vx: 0,
    vy: 0,
    vis: 0,
    lastMove: 0
  };

  function syncIconUniformBuffer() {
    if (!P.adaptive || !icons.length) {
      activeIconCount = 0;
      return;
    }
    const maxN = Math.min(icons.length, getProfile().maxIcons, MAX_ICONS);
    const padX = P.iconGlassStyle === 'prism' ? 4 : 7;
    const padY = P.iconGlassStyle === 'prism' ? 4 : 6;
    for (let i = 0; i < maxN; i++) {
      const ic = icons[i];
      iconsData[i * 4 + 0] = ic.x + ic.w * 0.5;
      iconsData[i * 4 + 1] = ic.y + ic.h * 0.5;
      iconsData[i * 4 + 2] = Math.max(22, ic.w * 0.5 + padX);
      iconsData[i * 4 + 3] = Math.max(24, ic.h * 0.5 + padY);
    }
    activeIconCount = maxN;
  }

  function stepPhysics(dt) {
    const flow = Math.max(0, P.flowSpeed);
    simTime += dt * (0.45 + 0.75 * flow);

    const prof = getProfile();
    const desiredDrops = Math.min(prof.maxDrops, Math.max(0, Math.round(5.2 * P.dropletCount)));
    const scaleFactor = Math.min(1.15, Math.max(0.65, Math.min(W, H) / 900));

    for (let i = 0; i < desiredDrops; i++) {
      const d = drops[i];
      const wobbleX = Math.sin(simTime * 0.7 + d.ph) * 14;
      const wobbleY = Math.cos(simTime * 0.6 + d.ph * 1.3) * 12;
      d.x += (d.vx + wobbleX) * dt * flow;
      d.y += (d.vy + wobbleY) * dt * flow;

      const rx = d.rx * scaleFactor;
      const ry = d.ry * scaleFactor;
      const padX = rx + 24;
      const padY = ry + 24;
      if (d.x < padX) { d.x = padX; d.vx = Math.abs(d.vx); }
      else if (d.x > W - padX) { d.x = W - padX; d.vx = -Math.abs(d.vx); }
      if (d.y < padY) { d.y = padY; d.vy = Math.abs(d.vy); }
      else if (d.y > H - padY) { d.y = H - padY; d.vy = -Math.abs(d.vy); }

      // Subtle breathing pulse
      const pulse = 1.0 + 0.04 * Math.sin(simTime * 1.1 + d.ph);
      dropsData[i * 4 + 0] = d.x;
      dropsData[i * 4 + 1] = d.y;
      dropsData[i * 4 + 2] = rx * pulse;
      dropsData[i * 4 + 3] = ry / pulse;
      dropsRound[i] = d.rd * scaleFactor;
    }

    // Spring-damper physics for cursor lens
    const wantCursor = !!P.cursorLens && cursorState.active && (performance.now() - cursorState.lastMove < 6500);
    cursorState.vis += ((wantCursor ? 1 : 0) - cursorState.vis) * Math.min(1, dt * (wantCursor ? 10 : 3.5));
    const stiff = 135;
    const damp = 17;
    const ax = (cursorState.tx - cursorState.x) * stiff - cursorState.vx * damp;
    const ay = (cursorState.ty - cursorState.y) * stiff - cursorState.vy * damp;
    cursorState.vx += ax * dt;
    cursorState.vy += ay * dt;
    cursorState.x += cursorState.vx * dt;
    cursorState.y += cursorState.vy * dt;
  }

  function uploadSharedUniforms(u, pw, ph, dpr, dropCount) {
    gl.uniform2f(u.u_resolution, pw, ph);
    gl.uniform1f(u.u_dpr, dpr);
    const mergePx = Math.max(0, P.mergeRate) * 44.0;
    gl.uniform1f(u.u_mergePx, mergePx);

    gl.uniform1i(u.u_dropCount, dropCount);
    if (dropCount > 0) {
      gl.uniform4fv(u.u_drops, dropsData);
      gl.uniform1fv(u.u_dropRound, dropsRound);
    }

    const cOn = P.cursorLens && cursorState.vis > 0.02 ? 1 : 0;
    gl.uniform1i(u.u_cursorOn, cOn);
    if (cOn) {
      const spdX = Math.min(26, Math.abs(cursorState.vx) * 0.022);
      const spdY = Math.min(26, Math.abs(cursorState.vy) * 0.022);
      const baseR = 54 * cursorState.vis;
      const hw = Math.max(8, baseR + spdX - spdY * 0.35);
      const hh = Math.max(8, baseR + spdY - spdX * 0.35);
      gl.uniform4f(u.u_cursor, cursorState.x, cursorState.y, hw, hh);
      gl.uniform1f(u.u_cursorRadius, Math.min(hw, hh) * 0.96);
    }

    gl.uniform1i(u.u_iconCount, activeIconCount);
    gl.uniform1i(u.u_iconStyle, ICON_STYLE_INDEX[P.iconGlassStyle] || 0);
    if (activeIconCount > 0) {
      gl.uniform4fv(u.u_icons, iconsData);
    }
  }

  function computeScale() {
    const qMax = getProfile().maxDpr;
    if (typeof window.__desklandScale === 'function') {
      return window.__desklandScale(qMax);
    }
    return Math.min(window.devicePixelRatio || 1, qMax);
  }

  function resize() {
    const box = cv.getBoundingClientRect();
    const prevW = W, prevH = H;
    W = Math.max(240, box.width || innerWidth || 1280);
    H = Math.max(160, box.height || innerHeight || 720);
    if (prevW > 0 && prevH > 0) {
      for (const d of drops) {
        d.x = (d.x / prevW) * W;
        d.y = (d.y / prevH) * H;
      }
    }
    const dpr = computeScale();
    cv.width = Math.max(1, Math.round(W * dpr));
    cv.height = Math.max(1, Math.round(H * dpr));
    cv._scale = dpr;
    rebuildFBOs(cv.width, cv.height);
    syncIconUniformBuffer();
    cacheOK = true;
  }

  function draw(now) {
    if (!glReady) return;
    const pw = cv.width;
    const ph = cv.height;
    const dpr = cv._scale || (pw / Math.max(1, W));
    if (!fboBg || fboBg.w !== pw || fboBg.h !== ph || !cacheOK) {
      rebuildFBOs(pw, ph);
      cacheOK = true;
    }

    const prof = getProfile();
    const dropCount = Math.min(prof.maxDrops, Math.max(0, Math.round(5.2 * P.dropletCount)));
    const palIdx = PALETTE_INDEX[P.palette] || 0;

    gl.bindVertexArray(quadVAO);

    // ---- Pass 0: Render crisp silk optical backdrop + glass cast shadows -> fboBg ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboBg.fbo);
    gl.viewport(0, 0, fboBg.w, fboBg.h);
    gl.useProgram(progBg);
    uploadSharedUniforms(uBg, pw, ph, dpr, dropCount);
    gl.uniform1f(uBg.u_time, simTime);
    gl.uniform1i(uBg.u_palette, palIdx);
    gl.uniform1f(uBg.u_shadowFactor, 1.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---- Pass 1 & 2: 2-pass separable Gaussian blur -> fboBlurB ----
    const blurRad = Math.min(prof.maxBlurTap, Math.max(0, Math.round(P.frostAmount * 11.5)));
    const weights = computeGaussianWeights(blurRad);

    gl.useProgram(progBlur);
    gl.uniform1i(uBlur.u_radius, blurRad);
    gl.uniform1fv(uBlur.u_weights, weights);
    gl.uniform1i(uBlur.u_tex, 0);

    // Horizontal pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurA.fbo);
    gl.viewport(0, 0, fboBlurA.w, fboBlurA.h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboBg.tex);
    gl.uniform2f(uBlur.u_texelDir, 1.0 / fboBlurA.w, 0.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Vertical pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurB.fbo);
    gl.viewport(0, 0, fboBlurB.w, fboBlurB.h);
    gl.bindTexture(gl.TEXTURE_2D, fboBlurA.tex);
    gl.uniform2f(uBlur.u_texelDir, 0.0, 1.0 / fboBlurB.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---- Pass 3: Main Physical Liquid Glass Composite -> Screen ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, pw, ph);
    gl.useProgram(progMain);
    uploadSharedUniforms(uMain, pw, ph, dpr, dropCount);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboBg.tex);
    gl.uniform1i(uMain.u_bg, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fboBlurB.tex);
    gl.uniform1i(uMain.u_blurredBg, 1);

    gl.uniform1f(uMain.u_refraction, Math.max(0.15, P.refraction));
    gl.uniform1f(uMain.u_frost, Math.max(0.0, P.frostAmount));
    gl.uniform1f(uMain.u_dispersion, Math.max(0.0, P.dispersion));

    // Palette-matched crystal glass tint
    if (palIdx === 0 || palIdx === 4) gl.uniform4f(uMain.u_tint, 0.88, 0.96, 1.00, 0.09);
    else if (palIdx === 1) gl.uniform4f(uMain.u_tint, 0.92, 0.90, 1.00, 0.08);
    else if (palIdx === 2) gl.uniform4f(uMain.u_tint, 1.00, 0.95, 0.90, 0.09);
    else gl.uniform4f(uMain.u_tint, 0.84, 0.90, 0.98, 0.07);

    // Gentle living glint drift
    gl.uniform1f(uMain.u_glareAngle, -0.78 + Math.sin(simTime * 0.25) * 0.14);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  // =========================================================================
  // LOOP, HOST MESSAGES & POINTER EVENTS
  // =========================================================================
  function sched() {
    if (!_paused && !rafId) {
      rafId = requestAnimationFrame(frame);
    }
  }

  function setPaused(v) {
    _paused = !!v;
    if (_paused) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    } else {
      lastT = 0;
      sched();
    }
  }

  function frame(now) {
    rafId = 0;
    if (_paused) return;
    sched();
    const minInterval = (LOW || window.__desklandLowMode) ? 62 : 28;
    if (lastT && now - lastT < minInterval) return;
    const dt = lastT ? Math.min(0.06, (now - lastT) / 1000) : 0.033;
    lastT = now;
    frameN++;
    stepPhysics(dt);
    draw(now);
  }

  function drawGhosts() {
    const box = document.getElementById('ghosts');
    if (!box) return;
    box.innerHTML = icons
      .map(ic => '<div class="ghost" style="left:' + ic.x + 'px;top:' + ic.y + 'px;width:' + ic.w + 'px;height:' + ic.h + 'px"><i></i><b></b></div>')
      .join('');
  }

  function applySettings(v) {
    if (!v || typeof v !== 'object') return;
    let needResize = false;
    for (const k in v) {
      if (!(k in P)) continue;
      if (k === 'palette' || k === 'iconGlassStyle' || k === 'quality') {
        if (typeof v[k] === 'string' && P[k] !== v[k]) {
          P[k] = v[k];
          if (k === 'quality') needResize = true;
        }
      } else if (k === 'cursorLens') {
        P[k] = !!v[k];
      } else if (typeof v[k] === 'number' && Number.isFinite(v[k])) {
        P[k] = v[k];
      }
    }
    syncIconUniformBuffer();
    if (needResize) resize();
  }

  function handleMessage(raw) {
    let m = raw;
    if (typeof m === 'string') {
      if (!m || m.charAt(0) !== '{') return;
      try { m = JSON.parse(m); } catch (_) { return; }
    }
    if (!m || typeof m !== 'object') return;

    if (m.t === 'pause') {
      setPaused(PREVIEW ? false : !!m.v);
    } else if (m.t === 'lowMode') {
      LOW = !!m.v;
      resize();
    } else if (m.t === 'settings') {
      applySettings(m.v || m.params || {});
    } else if (m.t === 'reset') {
      applySettings(Object.assign({}, DEFAULTS, m.v || {}));
    } else if (m.t === 'icons') {
      const k = window.devicePixelRatio || 1;
      icons = m.vis
        ? (m.r || []).map(([l, t, r, b]) => ({
            x: l / k,
            y: t / k,
            w: (r - l) / k,
            h: (b - t) / k
          }))
        : [];
      syncIconUniformBuffer();
      if (PREVIEW || !WALL) drawGhosts();
    }
  }

  function updatePointer(ev) {
    const rect = cv.getBoundingClientRect();
    cursorState.tx = ev.clientX - rect.left;
    cursorState.ty = ev.clientY - rect.top;
    if (!cursorState.active) {
      cursorState.x = cursorState.tx;
      cursorState.y = cursorState.ty;
      cursorState.vx = cursorState.vy = 0;
    }
    cursorState.active = true;
    cursorState.lastMove = performance.now();
  }
  window.addEventListener('pointermove', updatePointer, { passive: true });
  window.addEventListener('pointerdown', updatePointer, { passive: true });
  window.addEventListener('pointerleave', () => { cursorState.active = false; }, { passive: true });

  window.addEventListener('deskland:lowmode', ev => {
    LOW = !!(ev && ev.detail && ev.detail.lowMode);
    resize();
  });

  window.addEventListener('resize', resize);

  if (initGL()) {
    resize();
    if (!WALL) {
      const gd = document.createElement('div');
      gd.id = 'ghosts';
      document.body.appendChild(gd);
    }
    if (PREVIEW) {
      window.addEventListener('message', ev => {
        if (ev.source === parent) handleMessage(ev.data);
      });
      parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    } else if (WALL) {
      const host = window.chrome && window.chrome.webview;
      if (host) {
        host.addEventListener('message', ev => handleMessage(ev.data));
        host.postMessage('ready');
      }
    } else {
      icons = [
        [0.05, 0.09], [0.05, 0.23], [0.05, 0.37],
        [0.15, 0.09], [0.15, 0.23],
        [0.86, 0.12], [0.86, 0.26]
      ].map(([a, b]) => ({ x: W * a, y: H * b, w: 76, h: 90 }));
      syncIconUniformBuffer();
      drawGhosts();
    }
    sched();
  }
  </script>
  <script src="share.js"></script>
</body>
</html>
