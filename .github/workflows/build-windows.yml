name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Rust OpenGL engine (diyardesk_gl.dll)
        shell: pwsh
        run: |
          cargo build --release --manifest-path native\diyardesk-gl\Cargo.toml

      - name: Build host and NSIS installer
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            for ($i = 1; $i -le 3 -and -not (Test-Path -LiteralPath $nsis); $i++) {
              choco install nsis -y --no-progress
              if (-not (Test-Path -LiteralPath $nsis)) { Start-Sleep -Seconds (5 * $i) }
            }
          }
          if (-not (Test-Path -LiteralPath $nsis)) {
            winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
          }
          if (Test-Path -LiteralPath $nsis) {
            powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1 -NsisCompiler $nsis
          } else {
            powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: diyardesk-win-x64
          path: |
            dist\DiyarDesk-*-win-x64-Setup.exe
            dist\DiyarDesk-*-win-x64-Setup.exe.sha256
            dist\DiyarDesk-*-win-x64-Setup.exe.manifest.json
          if-no-files-found: error
