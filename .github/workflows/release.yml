name: Release All Platforms

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional; defaults to v<tools/version.json>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          $jsonVer = (Get-Content -LiteralPath tools\version.json -Raw | ConvertFrom-Json).version
          if ($tagVer -ne $jsonVer) {
            throw "Tag version ($tagVer) does not match tools/version.json ($jsonVer)"
          }

      - name: Build Rust OpenGL engine (diyardesk_gl.dll)
        shell: pwsh
        run: |
          cargo build --release --manifest-path native\diyardesk-gl\Cargo.toml

      - name: Build host and NSIS installer
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            choco install nsis -y --no-progress
          }
          if (Test-Path -LiteralPath $nsis) {
            powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1 -NsisCompiler $nsis
          } else {
            powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist\DiyarDesk-*-win-x64-Setup.exe
            dist\DiyarDesk-*-win-x64-Setup.exe.sha256
            dist\DiyarDesk-*-win-x64-Setup.exe.manifest.json
          if-no-files-found: error

  build-android:
    name: Build Android Tablet APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9

      - name: Run unit tests and build release APK
        run: gradle --project-dir android --no-daemon testDebugUnitTest assembleRelease

      - name: Package APK and SHA256
        run: |
          VER=$(python3 -c "import json; print(json.load(open('tools/version.json'))['version'])")
          mkdir -p out-android
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          OUT_NAME="DiyarDesk-${VER}-android-tablet.apk"
          cp "$APK" "out-android/$OUT_NAME"
          (cd out-android && sha256sum "$OUT_NAME" > "${OUT_NAME}.sha256")
          ls -lh out-android

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out-android/*
          if-no-files-found: error

  build-linux-deb-tar:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux test dependencies & run unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext python3-pytest python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=linux python3 -m pytest -p no:cacheprovider -v linux/tests
          find linux -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +

      - name: Build Rust OpenGL engine (libdiyardesk_gl.so)
        run: |
          cargo build --release --locked --manifest-path native/diyardesk-gl/Cargo.toml
          mkdir -p linux/lib
          cp native/diyardesk-gl/target/release/libdiyardesk_gl.so linux/lib/libdiyardesk_gl.so

      - name: Build .deb and generic Linux tarball
        run: |
          VER=$(python3 -c "import json; print(json.load(open('tools/version.json'))['version'])")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$VER" ]; then
              echo "Tag version ($TAG_VER) != tools/version.json ($VER)" >&2
              exit 1
            fi
          fi

          sh linux/packaging/build-deb.sh
          DEB_PATH=$(find dist -maxdepth 1 -type f -name 'diyardesk_*.deb' | head -n 1)
          test -n "$DEB_PATH"
          dpkg-deb -I "$DEB_PATH"

          STAGE_DIR=$(mktemp -d)
          PKG_ROOT="$STAGE_DIR/DiyarDesk-${VER}-linux"
          mkdir -p "$PKG_ROOT/linux/lib"
          cp LICENSE NOTICE README.md SECURITY.md THIRD_PARTY_NOTICES.md TRADEMARKS.md "$PKG_ROOT/"
          cp -a prototype "$PKG_ROOT/"
          cp -a linux/bin linux/deskland_linux linux/gnome-extension linux/kde-iconspy linux/packaging linux/plasma-wallpaper linux/tests linux/README.md linux/run.sh linux/build-native.sh "$PKG_ROOT/linux/"
          cp -a linux/lib/libdiyardesk_gl.so "$PKG_ROOT/linux/lib/libdiyardesk_gl.so"
          find "$PKG_ROOT" \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find "$PKG_ROOT" -name '*.pyc' -delete

          mkdir -p out-linux
          cp "$DEB_PATH" out-linux/
          TAR_NAME="DiyarDesk-${VER}-linux-any.tar.gz"
          tar -C "$STAGE_DIR" -czf "out-linux/$TAR_NAME" "DiyarDesk-${VER}-linux"
          rm -rf "$STAGE_DIR"

          (
            cd out-linux
            for f in diyardesk_*.deb "$TAR_NAME"; do
              sha256sum "$f" > "${f}.sha256"
            done
          )
          ls -lh out-linux

      - name: Upload Linux deb & tarball assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-deb-tar
          path: out-linux/*
          if-no-files-found: error

  build-linux-arch:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Arch package in container
        run: |
          VER=$(python3 -c "import json; print(json.load(open('tools/version.json'))['version'])")
          PKGBUILD_VER=$(sed -n 's/^pkgver=//p' linux/packaging/arch/PKGBUILD | head -n 1 | tr -d '[:space:]')
          if [ "$PKGBUILD_VER" != "$VER" ]; then
            echo "PKGBUILD pkgver ($PKGBUILD_VER) != tools/version.json ($VER)" >&2
            exit 1
          fi

          mkdir -p arch-build out-arch
          cp linux/packaging/arch/PKGBUILD arch-build/PKGBUILD
          git archive --format=tar.gz --prefix="DiyarDesk-${VER}/" HEAD -o "arch-build/diyardesk-${VER}.tar.gz"

          docker run --rm \
            -e PKG_UID="$(id -u)" \
            -e PKG_GID="$(id -g)" \
            -v "$PWD/arch-build:/build:ro" \
            -v "$PWD/out-arch:/out" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              mkdir -p /tmp/pkgbuild
              cp -a /build/. /tmp/pkgbuild/
              pacman -Syu --noconfirm --needed gettext rust cmake qt6-declarative
              useradd -m -s /bin/bash builder
              chown -R builder:builder /tmp/pkgbuild
              su - builder -c "cd /tmp/pkgbuild && SOURCE_DATE_EPOCH=$(date +%s) makepkg -d --noconfirm"
              cp /tmp/pkgbuild/diyardesk-[0-9]*.pkg.tar.zst /out/
              chown "$PKG_UID:$PKG_GID" /out/diyardesk-[0-9]*.pkg.tar.zst
            '

          (
            cd out-arch
            PKG=$(find . -maxdepth 1 -type f -name 'diyardesk-[0-9]*.pkg.tar.zst' -printf '%f\n' | head -n 1)
            test -n "$PKG"
            sha256sum "$PKG" > "${PKG}.sha256"
          )
          ls -lh out-arch

      - name: Upload Arch release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arch
          path: out-arch/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Swift tests & build macOS DMG
        run: bash macos/build-app.sh

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            out-macos/DiyarDesk-*-macos-*.dmg
            out-macos/DiyarDesk-*-macos-*.dmg.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-android
      - build-linux-deb-tar
      - build-linux-arch
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and checksums
        run: |
          ls -lh release-assets
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("release-assets")
          sha_files = sorted(root.glob("*.sha256"))
          assert sha_files, "No .sha256 files found"
          for sf in sha_files:
              line = sf.read_text(encoding="utf-8").replace("\r", "").strip().splitlines()[0]
              parts = line.split()
              expected_hash = parts[0].lower()
              filename = parts[-1].lstrip("*")
              target = root / filename
              assert target.is_file(), f"Missing target for checksum: {target}"
              actual_hash = hashlib.sha256(target.read_bytes()).hexdigest().lower()
              assert actual_hash == expected_hash, f"Checksum mismatch for {filename}: {actual_hash} != {expected_hash}"
              print(f"OK {filename}: {actual_hash}")

          for pattern in (
              "DiyarDesk-*-win-x64-Setup.exe",
              "DiyarDesk-*-win-x64-Setup.exe.manifest.json",
              "DiyarDesk-*-android-tablet.apk",
              "diyardesk_*.deb",
              "diyardesk-*.pkg.tar.zst",
              "DiyarDesk-*-linux-any.tar.gz",
              "DiyarDesk-*-macos-*.dmg",
          ):
              matches = list(root.glob(pattern))
              assert len(matches) == 1, f"Expected 1 file for {pattern}, found {matches}"
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VER=$(python3 -c "import json; print(json.load(open('tools/version.json'))['version'])")
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VER}"
          fi

          OBJ_TYPE=$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)
          TITLE="DiyarDesk $TAG"
          HAS_NOTES=0
          if [ "$OBJ_TYPE" = "tag" ]; then
            SUBJ=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG" | head -n 1)
            BODY=$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG")
            if [ -n "$SUBJ" ]; then
              TITLE="$SUBJ"
            fi
            if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$BODY" > release-notes.md
              HAS_NOTES=1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$HAS_NOTES" = "1" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            else
              gh release edit "$TAG" --title "$TITLE"
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            if [ "$HAS_NOTES" = "1" ]; then
              gh release create "$TAG" release-assets/* --title "$TITLE" --notes-file release-notes.md --verify-tag
            else
              gh release create "$TAG" release-assets/* --title "$TITLE" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
