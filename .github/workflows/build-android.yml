name: Build Android Tablet APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust Android targets
        shell: bash
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build native Rust + OpenGL ES 3.0 libraries for Android
        shell: bash
        run: |
          bash android/build-native-gl.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9

      - name: Run unit tests & build tablet APK
        run: gradle --project-dir android --no-daemon testDebugUnitTest assembleRelease

      - name: Package APK & SHA256
        shell: bash
        run: |
          VER=$(python3 -c "import json; print(json.load(open('tools/version.json'))['version'])")
          mkdir -p out-android
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            APK=$(find android/app/build/outputs/apk -type f -name "*${abi}*.apk" | head -n 1)
            if [ -z "$APK" ]; then
              echo "Missing APK for ABI=$abi!" >&2
              exit 1
            fi
            DEST="out-android/DiyarDesk-${VER}-android-tablet-${abi}.apk"
            cp "$APK" "$DEST"
            (cd out-android && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          done
          ls -lh out-android

      - name: Upload Android Tablet artifact
        uses: actions/upload-artifact@v7
        with:
          name: diyardesk-android-tablet
          path: out-android/*
