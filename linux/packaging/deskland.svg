<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="diyarSky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#13253b"/>
      <stop offset="52%" stop-color="#2e5478"/>
      <stop offset="100%" stop-color="#d98945"/>
    </linearGradient>
    <linearGradient id="diyarDuneBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4a95a"/>
      <stop offset="100%" stop-color="#c37b36"/>
    </linearGradient>
    <linearGradient id="diyarDuneFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c97a"/>
      <stop offset="100%" stop-color="#d28d3d"/>
    </linearGradient>
    <linearGradient id="diyarOasis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1fa59a"/>
      <stop offset="100%" stop-color="#4fd2c4"/>
    </linearGradient>
    <clipPath id="diyarClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <g clip-path="url(#diyarClip)">
    <rect x="8" y="8" width="112" height="112" fill="url(#diyarSky)"/>
    <!-- Warm sun glow -->
    <circle cx="88" cy="40" r="14" fill="#ffe19e" opacity="0.92"/>
    <circle cx="88" cy="40" r="22" fill="#ffd27d" opacity="0.22"/>
    <!-- Stars / twilight sparkle -->
    <circle cx="30" cy="28" r="1.7" fill="#fff7dd" opacity="0.88"/>
    <circle cx="46" cy="21" r="1.2" fill="#fff7dd" opacity="0.68"/>
    <circle cx="62" cy="30" r="1.4" fill="#fff7dd" opacity="0.72"/>
    <!-- Far desert ridge -->
    <path d="M6 74 Q36 56 66 68 T124 64 L124 122 L6 122 Z" fill="url(#diyarDuneBack)"/>
    <!-- Turquoise oasis ribbon -->
    <path d="M12 88 Q46 78 78 89 T124 85 L124 102 L12 102 Z" fill="url(#diyarOasis)" opacity="0.94"/>
    <!-- Foreground golden dune -->
    <path d="M6 94 Q40 84 74 96 T124 92 L124 122 L6 122 Z" fill="url(#diyarDuneFront)"/>
    <!-- Subtle adaptive desktop icon tiles nestled on dune/sky -->
    <rect x="24" y="45" width="13" height="13" rx="3.2" fill="#ffffff" opacity="0.94"/>
    <rect x="24" y="64" width="13" height="13" rx="3.2" fill="#ffffff" opacity="0.84"/>
  </g>
</svg>
